<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netbench · 网络测速台</title>
<style>
  :root {
    --bg: #0b0d12;
    --card-bg: #131722;
    --card-hover: #171d2b;
    --border: #222938;
    --text-main: #f0f3f8;
    --text-muted: #8b95a5;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #6366f1;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
  }

  /* Header */
  header {
    background: #0f131c;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
  .brand .tagline { color: var(--text-muted); font-size: 13px; }
  .server-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    background: #182030;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }

  /* Control Hero Bar */
  .hero-bar {
    max-width: 1280px;
    margin: 16px auto 0;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    background: #121622;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .url-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 320px;
  }
  .url-input-row label {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .server-url-input {
    flex: 1;
    background: #090b10;
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font: 13px ui-monospace, monospace;
    outline: none;
    min-width: 180px;
  }
  .server-url-input:focus { border-color: var(--primary); }

  .hero-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .size-select {
    background: #090b10;
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .size-select:focus { border-color: var(--primary); }

  /* Buttons */
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: #1c2333;
    color: var(--text-main);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  button:hover { background: #242d40; border-color: #38455f; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  button.primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
  }
  button.primary:hover { filter: brightness(1.1); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.45); }
  button.btn-all-global {
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
  }

  /* 3 Categories Layout */
  main {
    max-width: 1280px;
    margin: 16px auto;
    padding: 0 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 1024px) { main { grid-template-columns: 1fr; } }

  /* Category Card */
  .category-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .category-card:hover { border-color: #2e374c; }
  .card-top { margin-bottom: 14px; }
  .card-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }
  .card-endpoint {
    font-size: 11px;
    color: var(--text-muted);
    font-family: ui-monospace, monospace;
    background: #0c0e14;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid #1a202c;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #1a202d;
    color: var(--text-muted);
  }
  .status-badge.ok { background: #064e3b; color: #34d399; }
  .status-badge.warn { background: #451a03; color: #fbbf24; }
  .status-badge.err { background: #4c0519; color: #fb7185; }

  /* Metrics 3-box Grid */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 14px 0;
  }
  .metric-box {
    background: #0c0f16;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .metric-val {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
  }
  .metric-unit { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-left: 2px; }

  /* Button Actions */
  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-one-click {
    width: 100%;
    padding: 9px 0;
    font-weight: 600;
  }
  .sub-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .sub-actions button {
    padding: 6px 0;
    font-size: 12px;
  }

  /* Console Log Drawer */
  .log-section {
    max-width: 1280px;
    margin: 0 auto 30px;
    padding: 0 18px;
  }
  .log-card {
    background: #080a0f;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .log-header {
    background: #0e121a;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .log-title { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .log-box {
    height: 180px;
    overflow-y: auto;
    padding: 10px 14px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9d1d9;
    white-space: pre-wrap;
  }
  .log-box .log-row { margin-bottom: 3px; }
  .log-box .time { color: #6e7681; margin-right: 6px; }
  .log-box .tag { font-weight: 600; margin-right: 6px; }
  .log-box .tag.http { color: #60a5fa; }
  .log-box .tag.ws { color: #f59e0b; }
  .log-box .tag.webrtc { color: #34d399; }
  .log-box .tag.all { color: #c084fc; }
  .log-box .ok { color: var(--success); }
  .log-box .err { color: var(--danger); }
  .log-box .warn { color: var(--warning); }
  .log-box .mut { color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>netbench</h1>
    <span class="tagline">单端口网络测速台</span>
  </div>
  <div id="serverBadge" class="server-badge">
    <span class="dot"></span>
    <span id="serverInfoText">探测服务连接中…</span>
  </div>
</header>

<!-- Global Controls Hero -->
<div class="hero-bar">
  <div class="url-input-row">
    <label for="serverUrlInput">服务器 URL：</label>
    <input id="serverUrlInput" class="server-url-input" placeholder="输入目标服务地址，如 https://... 或 http://localhost:8080">
    <button id="btnApplyServerUrl">切换/重连</button>
  </div>
  <div class="hero-right">
    <label for="globalSize">数据包：</label>
    <select id="globalSize" class="size-select">
      <option value="1048576">1 MB (快速)</option>
      <option value="4194304" selected>4 MB (标准)</option>
      <option value="16777216">16 MB (深度)</option>
      <option value="67108864">64 MB (极限)</option>
    </select>
    <button id="btnRunAllGlobal" class="primary btn-all-global">
      <span>🚀</span> 全协议一键全测
    </button>
  </div>
</div>

<main>
  <!-- ================= 类别 1: HTTP ================= -->
  <section class="category-card" id="cardHttp">
    <div class="card-top">
      <div class="card-header-row">
        <h2 class="card-title">🌐 HTTP 测速</h2>
        <span class="status-badge ok" id="badgeHttp">REST API</span>
      </div>
      <div class="card-endpoint" id="endpointHttp">GET /api/blob · POST /api/upload</div>

      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">延迟 (RTT)</div>
          <div class="metric-val" id="valHttpPing">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">下行速率</div>
          <div class="metric-val" id="valHttpDown">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">上行速率</div>
          <div class="metric-val" id="valHttpUp">—</div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button id="btnHttpAll" class="primary btn-one-click">⚡ 一键测速 (延迟 + 上下行)</button>
      <div class="sub-actions">
        <button id="btnHttpPing">测延迟</button>
        <button id="btnHttpDown">测下行</button>
        <button id="btnHttpUp">测上行</button>
      </div>
    </div>
  </section>

  <!-- ================= 类别 2: WebSocket ================= -->
  <section class="category-card" id="cardWs">
    <div class="card-top">
      <div class="card-header-row">
        <h2 class="card-title">⚡ WebSocket 测速</h2>
        <span class="status-badge" id="badgeWs">未连接</span>
      </div>
      <div class="card-endpoint" id="endpointWs">ws://…/ws</div>

      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">延迟 (RTT)</div>
          <div class="metric-val" id="valWsPing">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">下行速率</div>
          <div class="metric-val" id="valWsDown">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">上行速率</div>
          <div class="metric-val" id="valWsUp">—</div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button id="btnWsAll" class="primary btn-one-click">⚡ 一键测速 (延迟 + 上下行)</button>
      <div class="sub-actions">
        <button id="btnWsPing">测延迟</button>
        <button id="btnWsDown">测下行</button>
        <button id="btnWsUp">测上行</button>
      </div>
    </div>
  </section>

  <!-- ================= 类别 3: PeerJS (WebRTC) ================= -->
  <section class="category-card" id="cardPeer">
    <div class="card-top">
      <div class="card-header-row">
        <h2 class="card-title">🔗 WebRTC 测速</h2>
        <span class="status-badge" id="badgePeer">初始化…</span>
      </div>
      <div class="card-endpoint" id="endpointPeer">DataChannel ↔ server</div>

      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">延迟 (RTT)</div>
          <div class="metric-val" id="valPeerPing">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">下行速率</div>
          <div class="metric-val" id="valPeerDown">—</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">上行速率</div>
          <div class="metric-val" id="valPeerUp">—</div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button id="btnPeerAll" class="primary btn-one-click">⚡ 一键测速 (延迟 + 上下行)</button>
      <div class="sub-actions">
        <button id="btnPeerPing">测延迟</button>
        <button id="btnPeerDown">测下行</button>
        <button id="btnPeerUp">测上行</button>
      </div>
    </div>
  </section>
</main>

<!-- Realtime Log Terminal -->
<div class="log-section">
  <div class="log-card">
    <div class="log-header">
      <span class="log-title">实时测试日志 (Console Output)</span>
      <button id="btnClearLog" style="padding: 2px 8px; font-size: 11px;">清空日志</button>
    </div>
    <div id="logBox" class="log-box"></div>
  </div>
</div>

<script src="/vendor/peerjs.min.js"></script>
<script>
/* ==================================================================== */
/*  工具与全局状态                                                       */
/* ==================================================================== */
const $ = (id) => document.getElementById(id);
const now = () => performance.now();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const fmtMs = (ms) => ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : ms.toFixed(1) + ' ms';
const fmtMbps = (bytes, ms) => (bytes * 8 / (ms / 1000) / 1e6).toFixed(1);

function getPayloadSize() {
  return parseInt($('globalSize').value, 10) || 4194304;
}

function log(tag, msg, cls = '') {
  const t = new Date().toTimeString().slice(0, 8);
  const box = $('logBox');
  const div = document.createElement('div');
  div.className = 'log-row';

  let tagClass = 'all';
  if (tag === 'HTTP') tagClass = 'http';
  else if (tag === 'WS') tagClass = 'ws';
  else if (tag === 'WebRTC') tagClass = 'webrtc';

  div.innerHTML = `<span class="time">[${t}]</span><span class="tag ${tagClass}">[${tag}]</span><span class="${cls}">${msg}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

$('btnClearLog').onclick = () => { $('logBox').innerHTML = ''; };

/* ==================================================================== */
/*  服务器 URL 统一解析与派生配置                                         */
/* ==================================================================== */
let currentBaseUrl = location.origin;
let endpoints = {
  httpPing: `${location.origin}/api/ping`,
  httpBlob: `${location.origin}/api/blob`,
  httpUpload: `${location.origin}/api/upload`,
  wsUrl: `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`,
  peerHost: location.hostname,
  peerPort: location.port ? parseInt(location.port, 10) : (location.protocol === 'https:' ? 443 : 80),
  peerSecure: location.protocol === 'https:',
  targetPeerId: 'server'
};

function parseAndApplyServerUrl(inputUrl) {
  let u;
  try {
    inputUrl = inputUrl.trim();
    if (!/^https?:\/\//i.test(inputUrl)) {
      inputUrl = (location.protocol || 'http:') + '//' + inputUrl;
    }
    u = new URL(inputUrl);
  } catch (e) {
    log('ALL', '输入的 URL 格式不正确: ' + e.message, 'err');
    return false;
  }

  currentBaseUrl = u.origin;
  $('serverUrlInput').value = currentBaseUrl;

  const isHttps = u.protocol === 'https:';
  const defaultPort = isHttps ? 443 : 80;
  const port = u.port ? parseInt(u.port, 10) : defaultPort;

  endpoints.httpPing = `${currentBaseUrl}/api/ping`;
  endpoints.httpBlob = `${currentBaseUrl}/api/blob`;
  endpoints.httpUpload = `${currentBaseUrl}/api/upload`;
  endpoints.wsUrl = `${isHttps ? 'wss:' : 'ws:'}//${u.host}/ws`;
  endpoints.peerHost = u.hostname;
  endpoints.peerPort = port;
  endpoints.peerSecure = isHttps;

  $('endpointHttp').textContent = `${currentBaseUrl}/api/…`;
  $('endpointWs').textContent = endpoints.wsUrl;
  $('endpointPeer').textContent = `DataChannel ↔ ${endpoints.targetPeerId}`;

  log('ALL', `目标服务器已设置为: ${currentBaseUrl}`, 'ok');

  // 断开已有连接并重新初始化
  if (wsInstance) {
    try { wsInstance.close(); } catch (_) {}
    wsInstance = null;
  }
  if (peerConn) {
    try { peerConn.close(); } catch (_) {}
    peerConn = null;
  }
  peerConnectingPromise = null;
  initPeer();

  return true;
}

$('btnApplyServerUrl').onclick = () => {
  parseAndApplyServerUrl($('serverUrlInput').value);
};
$('serverUrlInput').onkeydown = (e) => {
  if (e.key === 'Enter') parseAndApplyServerUrl($('serverUrlInput').value);
};

/* ==================================================================== */
/*  测速任务并发控制 (互斥锁)                                             */
/* ==================================================================== */
let isTesting = false;

function setBusy(busy) {
  isTesting = busy;
  const btns = document.querySelectorAll('.card-actions button, .header-actions button, #btnApplyServerUrl');
  btns.forEach(b => {
    b.disabled = busy;
  });
}

async function withBusy(fn) {
  if (isTesting) {
    log('ALL', '⚠️ 当前已有测速任务正在运行中，请等待其执行完成…', 'warn');
    return;
  }
  setBusy(true);
  try {
    await fn();
  } catch (_) {
    // 错误已在各个测速函数中单独捕获和记录
  } finally {
    setBusy(false);
  }
}

/* ==================================================================== */
/*  1. HTTP 测速模块                                                     */
/* ==================================================================== */
async function runHttpPing() {
  const url = endpoints.httpPing;
  log('HTTP', '开始探测 HTTP 延迟 (5 次 GET)…', 'mut');
  $('valHttpPing').innerHTML = `<span class="mut">测中…</span>`;

  try {
    const times = [];
    for (let i = 0; i < 5; i++) {
      const s = now();
      const res = await fetch(url, { cache: 'no-store' });
      await res.text();
      times.push(now() - s);
    }
    times.sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    $('valHttpPing').innerHTML = `${avg.toFixed(1)}<span class="metric-unit">ms</span>`;
    log('HTTP', `延迟探测完成: avg ${avg.toFixed(1)} ms (min ${times[0].toFixed(1)} / max ${times[times.length - 1].toFixed(1)})`, 'ok');
    return avg;
  } catch (e) {
    $('valHttpPing').innerHTML = `<span class="err">失败</span>`;
    log('HTTP', '延迟探测失败: ' + e.message, 'err');
    throw e;
  }
}

async function runHttpDownload() {
  const size = getPayloadSize();
  const url = `${endpoints.httpBlob}?size=${size}`;
  log('HTTP', `开始下行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valHttpDown').innerHTML = `0<span class="metric-unit">%</span>`;

  try {
    const s = now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    let total = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      total += value.byteLength;
      const pct = Math.min(99, Math.floor((total / size) * 100));
      $('valHttpDown').innerHTML = `${pct}<span class="metric-unit">%</span>`;
    }
    const dt = now() - s;
    const mbps = fmtMbps(total, dt);
    $('valHttpDown').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('HTTP', `下行完成: ${(total / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valHttpDown').innerHTML = `<span class="err">失败</span>`;
    log('HTTP', '下行失败: ' + e.message, 'err');
    throw e;
  }
}

async function runHttpUpload() {
  const size = getPayloadSize();
  const url = endpoints.httpUpload;
  log('HTTP', `开始上行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valHttpUp').innerHTML = `<span class="mut">测中…</span>`;

  try {
    const payload = new Uint8Array(size);
    payload.fill(0x5a);
    const s = now();
    const res = await fetch(url, {
      method: 'POST',
      body: payload,
      headers: { 'Content-Type': 'application/octet-stream' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await res.json();
    const dt = now() - s;
    const mbps = fmtMbps(size, dt);
    $('valHttpUp').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('HTTP', `上行完成: ${(size / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valHttpUp').innerHTML = `<span class="err">失败</span>`;
    log('HTTP', '上行失败: ' + e.message, 'err');
    throw e;
  }
}

async function runHttpAll() {
  await runHttpPing();
  await sleep(100);
  await runHttpDownload();
  await sleep(100);
  await runHttpUpload();
}

$('btnHttpPing').onclick = () => withBusy(runHttpPing);
$('btnHttpDown').onclick = () => withBusy(runHttpDownload);

/* ==================================================================== */
/*  2. WebSocket 测速模块                                                */
/* ==================================================================== */
let wsInstance = null;
let wsState = { down: null, up: null };

function ensureWsConn() {
  return new Promise((resolve, reject) => {
    if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
      return resolve(wsInstance);
    }
    const url = endpoints.wsUrl;
    log('WS', `正在连接 WebSocket [${url}]…`, 'mut');
    const w = new WebSocket(url);
    w.binaryType = 'arraybuffer';

    const timer = setTimeout(() => {
      w.close();
      $('badgeWs').textContent = '连接超时';
      $('badgeWs').className = 'status-badge err';
      reject(new Error('WebSocket 连接超时'));
    }, 8000);

    w.onopen = () => {
      clearTimeout(timer);
      wsInstance = w;
      $('badgeWs').textContent = '已连接';
      $('badgeWs').className = 'status-badge ok';
      log('WS', 'WebSocket 连接成功', 'ok');
      resolve(w);
    };

    w.onmessage = (ev) => {
      const d = ev.data;
      if (typeof d === 'string' || (d instanceof ArrayBuffer && d.byteLength < 4096)) {
        try {
          const m = JSON.parse(typeof d === 'string' ? d : new TextDecoder().decode(d));
          if (m && m.m === 'upDone' && wsState.up && m.id === wsState.up.id) {
            const st = wsState.up;
            wsState.up = null;
            if (st.resolve) st.resolve(m.size || st.size);
          }
        } catch (_) {}
        return;
      }
      if (wsState.down) {
        const bytes = d.byteLength !== undefined ? d.byteLength : (d.size || 0);
        wsState.down.got += bytes;
        const pct = Math.min(99, Math.floor((wsState.down.got / wsState.down.size) * 100));
        $('valWsDown').innerHTML = `${pct}<span class="metric-unit">%</span>`;
        if (wsState.down.got >= wsState.down.size) {
          const st = wsState.down;
          wsState.down = null;
          if (st.resolve) st.resolve(st.got);
        }
      }
    };

    w.onerror = () => {
      clearTimeout(timer);
      $('badgeWs').textContent = '连接异常';
      $('badgeWs').className = 'status-badge err';
    };

    w.onclose = () => {
      wsInstance = null;
      $('badgeWs').textContent = '未连接';
      $('badgeWs').className = 'status-badge';
    };
  });
}

async function runWsPing() {
  const w = await ensureWsConn();
  log('WS', '开始测试 WebSocket Ping 延迟 (5 次)…', 'mut');
  $('valWsPing').innerHTML = `<span class="mut">测中…</span>`;

  try {
    const times = [];
    for (let i = 0; i < 5; i++) {
      const s = now();
      const id = 'p_' + Math.random().toString(36).slice(2);
      await new Promise((res, rej) => {
        const timeout = setTimeout(() => rej(new Error('WS ping 超时')), 5000);
        const onMsg = (ev) => {
          try {
            const m = JSON.parse(ev.data);
            if (m.m === 'ping' && m.id === id) {
              clearTimeout(timeout);
              w.removeEventListener('message', onMsg);
              res();
            }
          } catch (_) {}
        };
        w.addEventListener('message', onMsg);
        w.send(JSON.stringify({ m: 'ping', id, t: Date.now() }));
      });
      times.push(now() - s);
      await sleep(30);
    }
    times.sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    $('valWsPing').innerHTML = `${avg.toFixed(1)}<span class="metric-unit">ms</span>`;
    log('WS', `延迟完成: avg ${avg.toFixed(1)} ms (min ${times[0].toFixed(1)} / max ${times[times.length - 1].toFixed(1)})`, 'ok');
    return avg;
  } catch (e) {
    $('valWsPing').innerHTML = `<span class="err">失败</span>`;
    log('WS', 'Ping 失败: ' + e.message, 'err');
    throw e;
  }
}

async function runWsDownload() {
  const w = await ensureWsConn();
  const size = getPayloadSize();
  log('WS', `开始 WebSocket 下行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valWsDown').innerHTML = `0<span class="metric-unit">%</span>`;

  try {
    const id = 'd_' + Date.now();
    const s = now();
    const timeoutMs = Math.max(35000, Math.ceil((size / 1048576) * 10000));
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        wsState.down = null;
        reject(new Error('WS 下行超时'));
      }, timeoutMs);
      wsState.down = {
        id,
        size,
        got: 0,
        resolve: () => {
          clearTimeout(timer);
          resolve();
        }
      };
      w.send(JSON.stringify({ m: 'down', size, id }));
    });

    const dt = now() - s;
    const mbps = fmtMbps(size, dt);
    $('valWsDown').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('WS', `下行完成: ${(size / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valWsDown').innerHTML = `<span class="err">失败</span>`;
    log('WS', '下行失败: ' + e.message, 'err');
    throw e;
  }
}

async function runWsUpload() {
  const w = await ensureWsConn();
  const size = getPayloadSize();
  log('WS', `开始 WebSocket 上行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valWsUp').innerHTML = `0<span class="metric-unit">%</span>`;

  try {
    const id = 'u_' + Date.now();
    const s = now();
    const timeoutMs = Math.max(35000, Math.ceil((size / 1048576) * 10000));
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        wsState.up = null;
        reject(new Error('WS 上行超时'));
      }, timeoutMs);

      wsState.up = {
        id,
        size,
        resolve: () => {
          clearTimeout(timer);
          resolve();
        }
      };

      w.send(JSON.stringify({ m: 'upStart', size, id }));

      const CHUNK = 32 * 1024;
      const chunk = new ArrayBuffer(CHUNK);
      new Uint8Array(chunk).fill(0x5a);
      let sent = 0;
      const pump = () => {
        while (sent < size) {
          if (w.bufferedAmount > 256 * 1024) {
            setTimeout(pump, 8);
            return;
          }
          const n = Math.min(CHUNK, size - sent);
          sent += n;
          w.send(n === CHUNK ? chunk : chunk.slice(0, n));
          const pct = Math.min(99, Math.floor((sent / size) * 100));
          $('valWsUp').innerHTML = `${pct}<span class="metric-unit">%</span>`;
        }
      };
      setTimeout(pump, 20);
    });

    const dt = now() - s;
    const mbps = fmtMbps(size, dt);
    $('valWsUp').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('WS', `上行完成: ${(size / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valWsUp').innerHTML = `<span class="err">失败</span>`;
    log('WS', '上行失败: ' + e.message, 'err');
    throw e;
  }
}

async function runWsAll() {
  await runWsPing();
  await sleep(100);
  await runWsDownload();
  await sleep(100);
  await runWsUpload();
}

/* ==================================================================== */
/*  3. WebRTC / PeerJS 测速模块 (直连 8080 服务端 server)                  */
/* ==================================================================== */
let peer = null;
let peerConn = null;
let peerReady = false;
let peerConnectingPromise = null;
let peerConnState = { expectedDownload: 0, downloadReceived: 0, downloadResolve: null, uploadResolve: null, pingMap: new Map() };

function initPeer() {
  if (peer) {
    try { peer.destroy(); } catch (_) {}
    peer = null;
  }
  peerConn = null;
  peerReady = false;
  peerConnectingPromise = null;

  peer = new Peer({
    host: endpoints.peerHost,
    port: endpoints.peerPort,
    path: '/peerjs',
    secure: endpoints.peerSecure,
    debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    }
  });

  $('badgePeer').textContent = '信令连接中…';
  $('badgePeer').className = 'status-badge warn';

  peer.on('open', (pid) => {
    peerReady = true;
    $('badgePeer').textContent = '就绪 (ID: ' + pid.slice(0, 6) + '…)';
    $('badgePeer').className = 'status-badge ok';
    log('WebRTC', `Peer 客户端就绪 (My ID: ${pid})`, 'ok');
    // 自动连接到服务端内置 Peer (server)
    ensurePeerConn().catch(() => {});
  });

  peer.on('connection', (c) => bindPeerConn(c));
  peer.on('error', (err) => {
    $('badgePeer').textContent = 'Peer 异常';
    $('badgePeer').className = 'status-badge err';
    log('WebRTC', `Peer 信令错误: ${err.type || err.message}`, 'err');
  });
}

function bindPeerConn(c) {
  peerConn = c;
  c.on('open', () => {
    $('badgePeer').textContent = `已直连 (${c.peer})`;
    $('badgePeer').className = 'status-badge ok';
    log('WebRTC', `WebRTC 数据通道已建立 ↔ ${c.peer}`, 'ok');
    try { if (c.dataChannel) c.dataChannel.binaryType = 'arraybuffer'; } catch (_) {}
  });

  c.on('data', (data) => {
    const st = peerConnState;
    if (typeof data === 'string') {
      let m; try { m = JSON.parse(data); } catch (_) { return; }
      if (m.m === 'ping') {
        c.send(JSON.stringify({ m: 'pong', id: m.id }));
      } else if (m.m === 'pong') {
        const p = st.pingMap.get(m.id);
        if (p) { st.pingMap.delete(m.id); p.resolve(now() - p.start); }
      } else if (m.m === 'got') {
        if (st.downloadResolve && (!m.id || m.id === st.downloadId)) {
          const r = st.downloadResolve;
          st.downloadResolve = null;
          st.expectedDownload = 0;
          r.resolve();
        }
        if (st.uploadResolve && (!m.id || m.id === st.uploadId)) {
          const r = st.uploadResolve;
          st.uploadResolve = null;
          r.resolve();
        }
      }
    } else {
      const bytes = data.byteLength !== undefined ? data.byteLength : (data.size || 0);
      if (st.expectedDownload > 0) {
        st.downloadReceived += bytes;
        const pct = Math.min(99, Math.floor((st.downloadReceived / st.expectedDownload) * 100));
        $('valPeerDown').innerHTML = `${pct}<span class="metric-unit">%</span>`;

        if (st.downloadReceived >= st.expectedDownload) {
          const r = st.downloadResolve;
          st.downloadResolve = null;
          st.expectedDownload = 0;
          if (r) r.resolve();
        }
      }
    }
  });

  c.on('close', () => {
    peerConn = null;
    $('badgePeer').textContent = '未连接';
    $('badgePeer').className = 'status-badge';
  });
}

function ensurePeerConn() {
  if (peerConn && peerConn.open) {
    return Promise.resolve(peerConn);
  }
  if (peerConnectingPromise) {
    return peerConnectingPromise;
  }

  peerConnectingPromise = new Promise((resolve, reject) => {
    const target = endpoints.targetPeerId || 'server';

    const tryConnect = () => {
      log('WebRTC', `正在建立 WebRTC 直连至服务端 [${target}]…`, 'mut');
      const c = peer.connect(target, { serialization: 'raw', reliable: true });
      bindPeerConn(c);

      const timer = setTimeout(() => {
        peerConnectingPromise = null;
        reject(new Error(`连接对端 ${target} 超时，请检查服务状态与网络`));
      }, 16000);

      c.on('open', () => {
        clearTimeout(timer);
        peerConnectingPromise = null;
        resolve(c);
      });
      c.on('error', (err) => {
        clearTimeout(timer);
        peerConnectingPromise = null;
        reject(err);
      });
    };

    if (!peerReady) {
      log('WebRTC', '等待 Peer 信令就绪…', 'mut');
      const waitInit = setInterval(() => {
        if (peerReady) {
          clearInterval(waitInit);
          tryConnect();
        }
      }, 150);
      setTimeout(() => {
        clearInterval(waitInit);
        if (!peerReady) {
          peerConnectingPromise = null;
          reject(new Error('Peer 信令初始化超时'));
        }
      }, 10000);
      return;
    }

    tryConnect();
  });

  return peerConnectingPromise;
}

async function runPeerPing() {
  const c = await ensurePeerConn();
  log('WebRTC', '开始 WebRTC Ping 延迟测试 (5 次)…', 'mut');
  $('valPeerPing').innerHTML = `<span class="mut">测中…</span>`;

  try {
    const times = [];
    for (let i = 0; i < 5; i++) {
      const id = 'p_' + Math.random().toString(36).slice(2);
      const dt = await new Promise((res, rej) => {
        const timer = setTimeout(() => {
          peerConnState.pingMap.delete(id);
          rej(new Error('WebRTC ping 超时'));
        }, 5000);
        peerConnState.pingMap.set(id, {
          start: now(),
          resolve: (ms) => {
            clearTimeout(timer);
            res(ms);
          }
        });
        c.send(JSON.stringify({ m: 'ping', id }));
      });
      times.push(dt);
      await sleep(30);
    }
    times.sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    $('valPeerPing').innerHTML = `${avg.toFixed(1)}<span class="metric-unit">ms</span>`;
    log('WebRTC', `延迟完成: avg ${avg.toFixed(1)} ms (min ${times[0].toFixed(1)} / max ${times[times.length - 1].toFixed(1)})`, 'ok');
    return avg;
  } catch (e) {
    $('valPeerPing').innerHTML = `<span class="err">失败</span>`;
    log('WebRTC', 'Ping 失败: ' + e.message, 'err');
    throw e;
  }
}

async function runPeerDownload() {
  const c = await ensurePeerConn();
  const size = getPayloadSize();
  log('WebRTC', `开始 WebRTC 下行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valPeerDown').innerHTML = `0<span class="metric-unit">%</span>`;

  try {
    const s = now();
    const id = 'd_' + Date.now();
    const timeoutMs = Math.max(35000, Math.ceil((size / 1048576) * 10000));
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        peerConnState.downloadResolve = null;
        peerConnState.expectedDownload = 0;
        reject(new Error('WebRTC 下行超时'));
      }, timeoutMs);
      peerConnState.expectedDownload = size;
      peerConnState.downloadReceived = 0;
      peerConnState.downloadId = id;
      peerConnState.downloadResolve = {
        resolve: () => {
          clearTimeout(timer);
          resolve();
        }
      };
      c.send(JSON.stringify({ m: 'req', size, id }));
    });

    const dt = now() - s;
    const mbps = fmtMbps(size, dt);
    $('valPeerDown').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('WebRTC', `下行完成: ${(size / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valPeerDown').innerHTML = `<span class="err">失败</span>`;
    log('WebRTC', '下行失败: ' + e.message, 'err');
    throw e;
  }
}

async function runPeerUpload() {
  const c = await ensurePeerConn();
  const size = getPayloadSize();
  log('WebRTC', `开始 WebRTC 上行测速 (${(size / 1048576).toFixed(0)} MB)…`, 'mut');
  $('valPeerUp').innerHTML = `0<span class="metric-unit">%</span>`;

  try {
    const s = now();
    const id = 'u_' + Date.now();
    const timeoutMs = Math.max(35000, Math.ceil((size / 1048576) * 10000));
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        peerConnState.uploadResolve = null;
        peerConnState.onUploadAck = null;
        reject(new Error('WebRTC 上行超时'));
      }, timeoutMs);

      peerConnState.uploadId = id;
      peerConnState.uploadResolve = {
        size,
        resolve: () => {
          clearTimeout(timer);
          resolve();
        }
      };

      const CHUNK = 16 * 1024;
      const chunk = new ArrayBuffer(CHUNK);
      new Uint8Array(chunk).fill(0x5a);
      let sent = 0;

      const pump = () => {
        const dc = c.dataChannel;
        while (sent < size) {
          if (dc && dc.bufferedAmount > 4 * 1024 * 1024) {
            setTimeout(pump, 4);
            return;
          }
          const n = Math.min(CHUNK, size - sent);
          c.send(n === CHUNK ? chunk : chunk.slice(0, n));
          sent += n;
          const pct = Math.min(99, Math.floor((sent / size) * 100));
          $('valPeerUp').innerHTML = `${pct}<span class="metric-unit">%</span>`;
        }
      };

      c.send(JSON.stringify({ m: 'send', size, id }));
      setTimeout(pump, 10);
    });

    const dt = now() - s;
    const mbps = fmtMbps(size, dt);
    $('valPeerUp').innerHTML = `${mbps}<span class="metric-unit">Mbps</span>`;
    log('WebRTC', `上行完成: ${(size / 1048576).toFixed(1)} MB 用时 ${fmtMs(dt)} → ${mbps} Mbps`, 'ok');
    return mbps;
  } catch (e) {
    $('valPeerUp').innerHTML = `<span class="err">失败</span>`;
    log('WebRTC', '上行失败: ' + e.message, 'err');
    throw e;
  }
}
